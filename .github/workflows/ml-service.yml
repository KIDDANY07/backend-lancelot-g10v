name: Servicio de ML

on:
  push:
    branches: [main]
    paths:
      - "ml-service/**"
      - "src/injury_risk_assessments/predictors/ml-features-payload.ts"
      - "src/ml_features/feature-export.service.ts"
      - ".github/workflows/ml-service.yml"
  pull_request:
    paths:
      - "ml-service/**"
      - "src/injury_risk_assessments/predictors/ml-features-payload.ts"
      - "src/ml_features/feature-export.service.ts"
      - ".github/workflows/ml-service.yml"

concurrency:
  group: ml-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas del servicio de ML
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml-service/requirements.txt
            ml-service/requirements-dev.txt
      - name: Instalar dependencias fijadas
        run: pip install -r requirements-dev.txt
      - name: Ejecutar pytest
        run: python -m pytest -q

  imagen:
    name: Imagen Docker y arranque
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen como en Railway
        run: docker build -t lancelot-ml:ci -f ml-service/Dockerfile ml-service
      - name: Arrancar con un volumen y sin backend
        run: |
          docker volume create modelos
          docker run -d --name ml -u 0 -p 8000:8000 \
            -e PORT=8000 -e MODELS_DIR=/app/models \
            -e BACKEND_URL=http://127.0.0.1:9 -e BACKEND_TIMEOUT_SECONDS=2 \
            -e ML_SERVICE_API_KEY=clave-de-ci \
            -v modelos:/app/models lancelot-ml:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs ml
          exit 1
      - name: Verificar que /predict exige la clave
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/predict \
            -H 'content-type: application/json' -d '{"features":{}}')
          test "$code" = "401"
      - name: Registros del contenedor
        if: always()
        run: docker logs ml || true
